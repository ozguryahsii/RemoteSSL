name: Security

# Secure coding pipeline of design doc §30.3: dependency and secret scanning, SAST, SBOM
# and container image scanning. Runs on every push and pull request, plus weekly so a newly
# disclosed vulnerability in an unchanged dependency is still caught.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      # Known-vulnerable NuGet packages fail the build rather than being reported quietly.
      - name: Vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Deprecated NuGet packages
        run: dotnet list package --deprecated --include-transitive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      # Secret scanning: a leaked credential in history is the failure mode §30.2 calls out.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['csharp', 'javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # CycloneDX SBOM for the .NET solution, published as a build artifact so a release
      # can be traced back to the exact dependency set it shipped with.
      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX RemoteSSL.sln -o sbom --json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  containers:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the filesystem — dependencies and OS packages the images are built from —
      # so a finding lands before an image is published rather than after.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
